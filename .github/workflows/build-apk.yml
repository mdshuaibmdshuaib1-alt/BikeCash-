name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Prepare Signing Keystore and Environment
        run: |
          chmod +x gradlew

          # 1. Ensure debug.keystore exists
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fresh debug keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 2. Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 3. Ensure app/google-services.json exists for Google Services Plugin
          if [ ! -f app/google-services.json ]; then
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
              echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON secret..."
              echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
            elif [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
              echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret..."
              echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
            elif [ -f google-services.json ]; then
              echo "Copying root google-services.json to app/google-services.json..."
              cp google-services.json app/google-services.json
            else
              echo "::warning ::app/google-services.json was not found in the checkout. To connect to Firebase, commit app/google-services.json or set the GOOGLE_SERVICES_JSON secret."
            fi
          fi

      - name: Configure Release Signing (Optional)
        id: release_check
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.RELEASE_STORE_PASSWORD }}" ]; then
            echo "Configuring release keystore from secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "has_release=true" >> $GITHUB_OUTPUT
          else
            echo "No release secrets provided; will build signed installable debug APK."
            echo "has_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Debug APK (Installable on any Android device)
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Build Release APK (if release secrets configured)
        if: steps.release_check.outputs.has_release == 'true'
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BikeCash-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
