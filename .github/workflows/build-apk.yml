name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Prepare Signing Keystore and Environment
        run: |
          chmod +x gradlew

          # 1. Ensure debug.keystore exists
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Restoring debug keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fresh debug keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          # 2. Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # 3. Ensure app/google-services.json exists for Google Services Plugin
          if [ ! -f app/google-services.json ]; then
            if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
              echo "Restoring app/google-services.json from GitHub Secret..."
              echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
            elif [ -f google-services.json.base64 ]; then
              echo "Restoring app/google-services.json from google-services.json.base64..."
              base64 -d google-services.json.base64 > app/google-services.json
            elif [ -f google-services.json ]; then
              echo "Copying google-services.json to app/google-services.json..."
              cp google-services.json app/google-services.json
            else
              echo "Writing embedded fallback app/google-services.json..."
              mkdir -p app
              cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "159766537979",
    "project_id": "bikecash",
    "storage_bucket": "bikecash.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:159766537979:android:031565e73ae952d75e725e",
        "android_client_info": {
          "package_name": "com.aistudio.bikecash.mptw"
        }
      },
      "oauth_client": [
        {
          "client_id": "159766537979-6pjnes4pcarlgirkuhv29p0odcmd0dlk.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "com.aistudio.bikecash.mptw",
            "certificate_hash": "45997f18d08604a0c5bac950743c6a446bcc5471"
          }
        },
        {
          "client_id": "159766537979-7qij25a26rsr36eoem076c610bia7m1e.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyCin0nFQ_xhgE6X5BclpBuAHPt0YYMFCqg"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "159766537979-7qij25a26rsr36eoem076c610bia7m1e.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
            fi
          fi

      - name: Configure Release Signing (Optional)
        id: release_check
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.RELEASE_STORE_PASSWORD }}" ]; then
            echo "Configuring release keystore from secrets..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "has_release=true" >> $GITHUB_OUTPUT
          else
            echo "No release secrets provided; will build signed installable debug APK."
            echo "has_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Debug APK (Installable on any Android device)
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Build Release APK (if release secrets configured)
        if: steps.release_check.outputs.has_release == 'true'
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BikeCash-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
